<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title description">
  <title id="title">Echo.me pink gradient</title>
  <description id="description">A simple pink and lavender gradient header.</description>
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="0.34" stop-color="#ffd5e8"/>
      <stop offset="0.7" stop-color="#ff9dca"/>
      <stop offset="1" stop-color="#e9c8ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#pink)"/>
</svg>
